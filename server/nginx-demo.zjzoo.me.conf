server
{
    listen 80;
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    http3 on;

    server_name demo.zjzoo.me;
    root /www/wwwroot/demo.zjzoo.me;
    index index.php index.html index.htm default.php default.htm default.html;

    #CERT-APPLY-CHECK--START
    # 用于SSL证书申请时的文件验证相关配置 -- 请勿删除
    include /www/server/panel/vhost/nginx/well-known/demo.zjzoo.me.conf;
    #CERT-APPLY-CHECK--END

    include /www/server/panel/vhost/nginx/extension/demo.zjzoo.me/*.conf;

    #SSL-START SSL相关配置，请勿删除或修改下一行带注释的404规则
    #error_page 404/404.html;

    #HTTP_TO_HTTPS_START
    set $isRedcert 1;
    if ($server_port != 443) {
        set $isRedcert 2;
    }
    if ($uri ~ /\.well-known/) {
        set $isRedcert 1;
    }
    if ($isRedcert != 1) {
        rewrite ^(/.*)$ https://$host$1 permanent;
    }
    #HTTP_TO_HTTPS_END

    ssl_certificate /www/server/panel/vhost/cert/demo.zjzoo.me/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/demo.zjzoo.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_early_data on;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Alt-Svc 'quic=":443"; h3=":443"; h3-29=":443"' always;

    quic_retry on;
    quic_gso on;
    error_page 497 https://$host$request_uri;
    #SSL-END

    #ERROR-PAGE-START  错误页配置，可以注释、删除或修改
    error_page 404 /404.html;
    #error_page 502 /502.html;
    #ERROR-PAGE-END

    # 坨坨方块 API：/api/login、/api/scores、/api/leaderboard 等统一交给 index.php。
    location /api/ {
        try_files $uri $uri/ /api/index.php?$query_string;
        add_header Cache-Control "no-store" always;
    }

    # 禁止从公网直接访问数据库配置、安装密钥和建表文件。
    location ~ ^/api/(?:config|config\.example|\.setup-key)\.php$ {
        return 404;
    }

    location ~* ^/api/.*\.sql$ {
        return 404;
    }

    # H5 单页应用路由回退。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite 带哈希的静态资源可以长期缓存。
    location ~* ^/assets/.*\.(?:js|css|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    #PHP-INFO-START  PHP引用配置，可以注释或修改
    include enable-php-82.conf;
    #PHP-INFO-END

    #REWRITE-START URL重写规则引用,修改后将导致面板设置的伪静态规则失效
    include /www/server/panel/vhost/rewrite/demo.zjzoo.me.conf;
    #REWRITE-END

    # 禁止访问常见敏感文件。
    location ~* (\.user\.ini|\.htaccess|\.htpasswd|\.env.*|\.project|\.bashrc|\.bash_profile|\.bash_logout|\.DS_Store|\.gitignore|\.gitattributes|LICENSE|README\.md|CLAUDE\.md|CHANGELOG\.md|CHANGELOG|CONTRIBUTING\.md|TODO\.md|FAQ\.md|composer\.json|composer\.lock|package(-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|\.\w+~|\.swp|\.swo|\.bak(up)?|\.old|\.tmp|\.temp|\.log|\.sql(\.gz)?|docker-compose\.yml|docker\.env|Dockerfile|\.csproj|\.sln|Cargo\.toml|Cargo\.lock|go\.mod|go\.sum|phpunit\.xml|pom\.xml|build\.gradl|pyproject\.toml|requirements\.txt|application(-\w+)?\.(ya?ml|properties))$ {
        return 404;
    }

    # 禁止访问常见敏感目录。
    location ~* /(\.git|\.svn|\.bzr|\.vscode|\.claude|\.idea|\.ssh|\.github|\.npm|\.yarn|\.pnpm|\.cache|\.husky|\.turbo|\.next|\.nuxt|node_modules|runtime)/ {
        return 404;
    }

    # Let's Encrypt 验证目录。
    location ~ \.well-known {
        allow all;
    }

    if ($uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$") {
        return 403;
    }

    # 非 Vite assets 目录中的图片缓存。
    location ~* .*\.(gif|jpg|jpeg|png|bmp|swf)$ {
        expires 30d;
        error_log /dev/null;
        access_log off;
    }

    # 非 Vite assets 目录中的 JS/CSS 缓存。
    location ~* .*\.(js|css)$ {
        expires 12h;
        error_log /dev/null;
        access_log off;
    }

    access_log /www/wwwlogs/demo.zjzoo.me.log;
    error_log /www/wwwlogs/demo.zjzoo.me.error.log;
}

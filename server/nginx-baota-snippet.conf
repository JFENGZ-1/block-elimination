# 将以下内容加入宝塔站点的 server { ... } 内，并保留宝塔自动生成的 PHP 8.2 配置。
# 若已有 location /，请替换原配置，不能重复声明。

location /api/ {
    try_files $uri $uri/ /api/index.php?$query_string;
    add_header Cache-Control "no-store" always;
}

# 配置文件只允许 PHP 进程读取，禁止通过 HTTP 直接访问。
# 禁止读取配置、安装密钥和数据库脚本。setup.php 本身仍可正常访问。
location ~ ^/api/(?:config|config\.example|\.setup-key)\.php$ {
    deny all;
    return 404;
}

location = /api/schema.sql {
    deny all;
    return 404;
}

# H5 单页入口。
location / {
    try_files $uri $uri/ /index.html;
}

location ~* ^/assets/.*\.(?:js|css|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    access_log off;
}
